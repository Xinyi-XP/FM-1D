<!-- Save statue: clt + S (Windows) or Cmd + S (Mac) / 
 Force refresh browser: Ctrl + F5 (Windows) or Cmd + Shift + R (Mac)
 Open in browser: Alt + B (idk abt mac but right click anywhere > 
 "open on default browser" should work)
 -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VenaFlow — Bernoulli Split-Manifold Simulator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0b0f1a;
    --surface:  #111827;
    --surface2: #1a2235;
    --border:   #1e2d45;
    --accent:   #38bdf8;
    --accent2:  #f97316;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --green:    #34d399;
    --red:      #f87171;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px;
  }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: .15em; color: var(--accent); text-transform: uppercase; }
  header p  { font-size: .75rem; color: var(--muted); margin-top: 3px; letter-spacing: .08em; }
  .equation {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 6px;
    padding: 7px 14px; font-size: .75rem; color: var(--muted);
    text-align: center; margin-bottom: 16px;
    font-family: 'Courier New', monospace; max-width: 680px; width: 100%;
  }
  .equation b { color: var(--accent); }
  .main { display: flex; gap: 16px; width: 100%; max-width: 960px; align-items: flex-start; flex-wrap: wrap; }

  /* ── PANEL ── */
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; width: 230px; flex-shrink: 0;
  }
  .panel h2 { font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 7px; }
  .ctrl-group { margin-bottom: 16px; }
  .ctrl-group label { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-bottom: 5px; }
  .ctrl-group label span { color: var(--accent); font-family: 'Courier New', monospace; font-weight: 700; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: var(--border); border-radius: 2px; outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 7px rgba(56,189,248,.5); }
  .throat-btns { display: flex; gap: 5px; margin-top: 4px; }
  .throat-btns button { flex: 1; padding: 5px 0; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); border-radius: 5px; font-size: .8rem; font-weight: 700; cursor: pointer; transition: all .15s; }
  .throat-btns button:hover  { border-color: var(--accent); color: var(--accent); }
  .throat-btns button.active { background: rgba(56,189,248,.12); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px rgba(56,189,248,.2); }
  .metrics { margin-top: 18px; display: flex; flex-direction: column; gap: 9px; }
  .metric { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; }
  .metric-label { font-size: .62rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
  .metric-value { font-size: 1.15rem; font-weight: 700; font-family: 'Courier New', monospace; }
  .metric-unit  { font-size: .62rem; color: var(--muted); margin-left: 3px; }

  /* ── CANVAS ── */
  .canvas-wrap { flex: 1; min-width: 280px; height: 500px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  .clabel { position: absolute; font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); left: 50%; transform: translateX(-50%); pointer-events: none; }
  .clabel.top { top: 8px; }
  .clabel.bot { bottom: 8px; }
</style>
</head>
<body>

<header>
  <h1>VenaFlow</h1>
  <p>Bernoulli Split-Manifold Simulator &nbsp;·&nbsp; Upward Flow &nbsp;·&nbsp; N Parallel Throats</p>
</header>

<div class="equation">
  <b>P + ½ρv² = const</b> &nbsp;|&nbsp; <b>A₀v₀ = N · A₂v₂</b> &nbsp;|&nbsp; ρ = 1000 kg/m³ &nbsp;|&nbsp; upward flow
</div>

<div class="main">
  <!-- CONTROLS -->
  <div class="panel">
    <h2>Parameters</h2>
    <div class="ctrl-group">
      <label>Main diameter D₀ <span id="d0v">56 mm</span></label>
      <input type="range" id="d0" min="30" max="80" value="56" step="1">
    </div>
    <div class="ctrl-group">
      <label>Throat diameter D₂ <span id="d2v">18 mm</span></label>
      <input type="range" id="d2" min="8" max="35" value="18" step="1">
    </div>
    <div class="ctrl-group">
      <label>Inlet velocity v₀ <span id="v0v">3.0 m/s</span></label>
      <input type="range" id="v0" min="1" max="10" value="3" step="0.5">
    </div>
    <div class="ctrl-group">
      <label>Throats N <span id="nv">1</span></label>
      <div class="throat-btns" id="throatBtns">
        <button onclick="setN(1)" class="active">1</button>
        <button onclick="setN(2)">2</button>
        <button onclick="setN(3)">3</button>
        <button onclick="setN(4)">4</button>
        <button onclick="setN(5)">5</button>
      </div>
    </div>
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Throat velocity v₂</div>
        <div class="metric-value" id="mv2" style="color:var(--red)">—<span class="metric-unit">m/s</span></div>
      </div>
      <div class="metric">
        <div class="metric-label">Main pressure P₀</div>
        <div class="metric-value" id="mp0" style="color:var(--accent)">—<span class="metric-unit">kPa</span></div>
      </div>
      <div class="metric">
        <div class="metric-label">Throat pressure P₂</div>
        <div class="metric-value" id="mp2" style="color:var(--accent2)">—<span class="metric-unit">kPa</span></div>
      </div>
      <div class="metric">
        <div class="metric-label">Pressure drop ΔP</div>
        <div class="metric-value" id="mdp" style="color:var(--green)">—<span class="metric-unit">kPa</span></div>
      </div>
    </div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap" id="wrap">
    <div class="clabel top">↑ OUTLET</div>
    <canvas id="c"></canvas>
    <div class="clabel bot">INLET ↑</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const RHO    = 1000;
const P_REF  = 200000;

let N         = 1;
let particles = [];
let frame     = 0;

// Polyfill for rounded rects for maximum browser compatibility
function fillRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function getVals() {
  const d0 = +document.getElementById('d0').value;
  const d2 = +document.getElementById('d2').value;
  const v0 = +document.getElementById('v0').value;
  const A0 = Math.PI * (d0 / 2) ** 2;
  const A2 = Math.PI * (d2 / 2) ** 2;
  const v2 = v0 * A0 / (N * A2);
  const dP = 0.5 * RHO * (v2 * v2 - v0 * v0);
  return { d0, d2, v0, v2, P0: P_REF, P2: P_REF - dP, dP };
}

function setN(n) {
  N = n;
  document.getElementById('nv').textContent = n;
  document.querySelectorAll('.throat-btns button').forEach((b, i) =>
    b.classList.toggle('active', i + 1 === n));
  particles = [];
}

const MARGIN_FRAC  = 0.07;
const CONV_FRAC    = 0.22;
const THROAT_FRAC  = 0.22;
const DIV_FRAC     = 0.22;

function zones(H) {
  const M = H * MARGIN_FRAC;
  const conv   = H * CONV_FRAC;
  const throat = H * THROAT_FRAC;
  const divg   = H * DIV_FRAC;
  return {
    stemTop:    M,
    splitStart: M + conv,
    splitEnd:   M + conv + throat,
    stemBot:    M + conv + throat + divg,
    M, conv, throat, divg
  };
}

function mainR(W, d0) { return Math.min(d0 / 2 * (W * 0.12 / 40), W * 0.18); }

function throatR(W, d0, d2, n) {
  const mr = mainR(W, d0);
  const GAP = 3;
  const maxTotal = mr * 2 - GAP * (n + 1);
  return Math.min(d2 / d0 * mr, Math.max(2, maxTotal / (2 * n)));
}

function branchCXs(W, d0, d2) {
  const cx  = W / 2;
  const tr  = throatR(W, d0, d2, N);
  const GAP = 5;
  const total = N * 2 * tr + (N - 1) * GAP;
  const startX = cx - total / 2 + tr;
  return Array.from({ length: N }, (_, i) => startX + i * (2 * tr + GAP));
}

function drawPipe(W, H, d0, d2, v0, v2) {
  const cx  = W / 2;
  const mr  = mainR(W, d0);
  const tr  = throatR(W, d0, d2, N);
  const bxs = branchCXs(W, d0, d2);
  const z   = zones(H);
  const GAP = 5;

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0,   'rgba(56,189,248,0.06)');
  grad.addColorStop(0.5, 'rgba(249,115,22,0.10)');
  grad.addColorStop(1,   'rgba(56,189,248,0.06)');

  ctx.save();
  buildPipePath(W, H, cx, mr, tr, bxs, z, GAP);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  ctx.save();
  buildPipePath(W, H, cx, mr, tr, bxs, z, GAP);
  ctx.clip();
  ctx.fillStyle = 'rgba(249,115,22,0.07)';
  ctx.fillRect(0, z.splitStart, W, z.throat);
  ctx.restore();

  ctx.save();
  buildPipePath(W, H, cx, mr, tr, bxs, z, GAP);
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth   = 2;
  ctx.shadowColor = 'rgba(56,189,248,0.45)';
  ctx.shadowBlur  = 9;
  ctx.stroke();
  ctx.restore();

  if (N > 1) {
    drawBranchWalls(W, H, cx, mr, tr, bxs, z, GAP);
  }

  drawManometers(W, H, cx, mr, tr, bxs, z);
  drawArrows(W, H, cx, mr, tr, bxs, z, v0, v2);

  const tLabelY = (z.splitStart + z.splitEnd) / 2 + 4;
  const rightEdge = cx + mr + 12;
  ctx.fillStyle = 'rgba(249,115,22,0.75)';
  ctx.font = '700 9px "Courier New"';
  ctx.textAlign = 'left';
  ctx.fillText(N > 1 ? `${N}× THROAT` : 'THROAT', rightEdge, tLabelY);
}

function buildPipePath(W, H, cx, mr, tr, bxs, z, GAP) {
  ctx.beginPath();

  if (N === 1) {
    ctx.moveTo(cx - mr, 0);
    ctx.lineTo(cx - mr, z.stemTop);
    ctx.bezierCurveTo(cx - mr, z.stemTop + z.conv * 0.6, cx - tr, z.splitStart - z.conv * 0.1, cx - tr, z.splitStart);
    ctx.lineTo(cx - tr, z.splitEnd);
    ctx.bezierCurveTo(cx - tr, z.splitEnd + z.divg * 0.1, cx - mr, z.stemBot - z.divg * 0.6, cx - mr, z.stemBot);
    ctx.lineTo(cx - mr, H);
    ctx.lineTo(cx + mr, H);
    ctx.lineTo(cx + mr, z.stemBot);
    ctx.bezierCurveTo(cx + mr, z.stemBot - z.divg * 0.6, cx + tr, z.splitEnd + z.divg * 0.1, cx + tr, z.splitEnd);
    ctx.lineTo(cx + tr, z.splitStart);
    ctx.bezierCurveTo(cx + tr, z.splitStart - z.conv * 0.1, cx + mr, z.stemTop + z.conv * 0.6, cx + mr, z.stemTop);
    ctx.lineTo(cx + mr, 0);
    ctx.closePath();
    return;
  }

  const leftEdge  = bxs[0] - tr;
  const rightEdge = bxs[N - 1] + tr;

  ctx.moveTo(cx - mr, 0);
  ctx.lineTo(cx - mr, z.stemTop);
  ctx.bezierCurveTo(
    cx - mr, z.stemTop + z.conv * 0.55,
    leftEdge, z.splitStart - z.conv * 0.1,
    leftEdge, z.splitStart
  );
  ctx.lineTo(leftEdge, z.splitEnd);
  ctx.bezierCurveTo(
    leftEdge, z.splitEnd + z.divg * 0.1,
    cx - mr, z.stemBot - z.divg * 0.55,
    cx - mr, z.stemBot
  );
  ctx.lineTo(cx - mr, H);

  ctx.lineTo(cx + mr, H);

  ctx.lineTo(cx + mr, z.stemBot);
  ctx.bezierCurveTo(
    cx + mr, z.stemBot - z.divg * 0.55,
    rightEdge, z.splitEnd + z.divg * 0.1,
    rightEdge, z.splitEnd
  );
  ctx.lineTo(rightEdge, z.splitStart);
  ctx.bezierCurveTo(
    rightEdge, z.splitStart - z.conv * 0.1,
    cx + mr, z.stemTop + z.conv * 0.55,
    cx + mr, z.stemTop
  );
  ctx.lineTo(cx + mr, 0);
  ctx.closePath();
}

function drawBranchWalls(W, H, cx, mr, tr, bxs, z, GAP) {
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth   = 1.8;
  ctx.shadowColor = 'rgba(56,189,248,0.3)';
  ctx.shadowBlur  = 5;

  for (let i = 0; i < N - 1; i++) {
    const wallX = bxs[i] + tr + GAP / 2;
    const forkTipY = z.stemTop + (z.splitStart - z.stemTop) * 0.15;

    ctx.beginPath();
    ctx.moveTo(wallX, z.splitStart);
    ctx.bezierCurveTo(
      wallX, z.splitStart - (z.splitStart - forkTipY) * 0.4,
      cx, forkTipY + (z.splitStart - forkTipY) * 0.25,
      cx, forkTipY
    );
    ctx.stroke();

    const forkBotY = z.stemBot - (z.stemBot - z.splitEnd) * 0.15;
    ctx.beginPath();
    ctx.moveTo(wallX, z.splitEnd);
    ctx.bezierCurveTo(
      wallX, z.splitEnd + (forkBotY - z.splitEnd) * 0.4,
      cx, forkBotY - (forkBotY - z.splitEnd) * 0.25,
      cx, forkBotY
    );
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(wallX, z.splitStart);
    ctx.lineTo(wallX, z.splitEnd);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

function drawManometers(W, H, cx, mr, tr, bxs, z) {
  const { P0, P2 } = getVals();
  const mainY   = z.stemBot + (H - z.stemBot) * 0.5;
  const throatY = (z.splitStart + z.splitEnd) / 2;

  const rightWall = cx + mr;
  const pts = [
    { y: mainY,   P: P0, col: '#38bdf8', lbl: 'P₀' },
    { y: throatY, P: P2, col: '#f97316', lbl: 'P₂' },
  ];

  pts.forEach(({ y, P, col, lbl }) => {
    const ox = rightWall + 8;
    const bH = 34, bW = 10;
    const fH = Math.max(2, Math.min(Math.max(0, P) / P_REF, 1.2) * bH);

    ctx.setLineDash([2, 2]);
    ctx.strokeStyle = 'rgba(100,116,139,0.4)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(rightWall, y); ctx.lineTo(ox + bW + 2, y); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#0b0f1a';
    ctx.strokeStyle = '#1e2d45';
    ctx.lineWidth = 0.8;
    fillRoundedRect(ox + bW + 2, y - bH, bW, bH, 3);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = col;
    ctx.globalAlpha = 0.75;
    fillRoundedRect(ox + bW + 3, y - fH - 1, bW - 2, fH, 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = col;
    ctx.font = '700 9px "Courier New"';
    ctx.textAlign = 'left';
    ctx.fillText(lbl, ox + bW * 2 + 6, y - bH / 2 + 3);
  });
}

function drawArrows(W, H, cx, mr, tr, bxs, z, v0, v2) {
  const mainY   = z.stemBot + (H - z.stemBot) * 0.5;
  const throatY = (z.splitStart + z.splitEnd) / 2;

  const pts = [
    { y: mainY,   v: v0, col: '#38bdf8', x: cx },
    { y: throatY, v: v2, col: '#f97316', x: cx },
  ];

  pts.forEach(({ y, v, col, x }) => {
    const len = Math.min(v * 3.5, 30);
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.lineWidth = 2; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(x, y + len / 2); ctx.lineTo(x, y - len / 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y - len / 2);
    ctx.lineTo(x - 4, y - len / 2 + 8);
    ctx.lineTo(x + 4, y - len / 2 + 8);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = col;
    ctx.font = '700 9px "Courier New"';
    ctx.textAlign = 'right';
    ctx.fillText(v.toFixed(1) + ' m/s', cx - mr - 8, y + 4);
  });
}

function spawnParticle(W, H, d0) {
  const cx = W / 2;
  const mr = mainR(W, d0);
  const lane = (Math.random() * 2 - 1) * 0.82;
  particles.push({ x: cx + lane * mr, lane, y: H - 2, age: 0 });
}

function moveParticles(W, H, d0, d2, v0, v2) {
  const cx  = W / 2;
  const mr  = mainR(W, d0);
  const tr  = throatR(W, d0, d2, N);
  const bxs = branchCXs(W, d0, d2);
  const z   = zones(H);

  particles = particles.filter(p => p.y > -10);
  particles.forEach(p => {
    const inThroat = p.y >= z.splitStart && p.y <= z.splitEnd;
    const tFrac = inThroat ? 1
      : p.y < z.splitStart
        ? Math.max(0, 1 - (z.splitStart - p.y) / (z.conv))
        : Math.max(0, 1 - (p.y - z.splitEnd) / (z.divg));

    const speed = (v0 + (v2 - v0) * tFrac) * 0.45;
    p.y -= speed;

    if (inThroat || p.y < z.splitStart + z.conv * 0.3) {
      if ((p.branch === undefined || p.branch >= N) && N > 1) {
        p.branch = Math.min(N - 1, Math.max(0, Math.floor((p.lane + 1) / 2 * N)));
      }
      const targetCX = N === 1 ? cx : bxs[p.branch ?? 0];
      const t = Math.min(1, Math.max(0, 1 - (p.y - z.splitStart) / (z.conv)));
      p.x = cx * (1 - t) + (targetCX + p.lane * tr) * t;
    } else {
      p.x = cx + p.lane * mr;
      p.branch = undefined;
    }
    p.age++;
  });
}

function drawParticles(H) {
  const z = zones(H);
  particles.forEach(p => {
    const inThroat = p.y >= z.splitStart && p.y <= z.splitEnd;
    const t = inThroat ? 1 : 0;
    const cr = Math.round(56  + (249 - 56)  * t);
    const cg = Math.round(189 + (115 - 189) * t);
    const cb = Math.round(248 + (22  - 248) * t);
    ctx.beginPath();
    ctx.arc(p.x, p.y, inThroat ? 2.8 : 2.0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${cr},${cg},${cb},${Math.min(p.age / 6, 0.9)})`;
    ctx.fill();
  });
}

function updateMetrics(v2, P0, P2, dP) {
  document.getElementById('mv2').innerHTML = v2.toFixed(1) + '<span class="metric-unit">m/s</span>';
  document.getElementById('mp0').innerHTML = (P0/1e3).toFixed(1) + '<span class="metric-unit">kPa</span>';
  document.getElementById('mp2').innerHTML = (P2/1e3).toFixed(1) + '<span class="metric-unit">kPa</span>';
  document.getElementById('mdp').innerHTML = (Math.abs(dP)/1e3).toFixed(1) + '<span class="metric-unit">kPa</span>';
}

function resize() {
  const wrap = document.getElementById('wrap');
  const dpr = window.devicePixelRatio || 1;
  const rect = wrap.getBoundingClientRect();
  
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
}

function loop() {
  frame++;
  const wrap = document.getElementById('wrap');
  const rect = wrap.getBoundingClientRect();
  const W = rect.width, H = rect.height;

  const { d0, d2, v0, v2, P0, P2, dP } = getVals();

  if (frame % 2 === 0 && particles.length < 60 + N * 8) spawnParticle(W, H, d0);
  moveParticles(W, H, d0, d2, v0, v2);

  ctx.clearRect(0, 0, W, H);
  drawPipe(W, H, d0, d2, v0, v2);
  drawParticles(H);
  updateMetrics(v2, P0, P2, dP);

  requestAnimationFrame(loop);
}

document.getElementById('d0').addEventListener('input', function () {
  document.getElementById('d0v').textContent = this.value + ' mm';
  particles = [];
});
document.getElementById('d2').addEventListener('input', function () {
  document.getElementById('d2v').textContent = this.value + ' mm';
  particles = [];
});
document.getElementById('v0').addEventListener('input', function () {
  document.getElementById('v0v').textContent = (+this.value).toFixed(1) + ' m/s';
});
window.addEventListener('resize', () => { resize(); particles = []; });

resize();
loop();
</script>
</body>
</html>
